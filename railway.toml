# Railway — Next.js (Nixpacks)
# https://docs.railway.com/guides/nodejs
#
# NO poner `npm ci` acá: Nixpacks ya lo corre en la fase install.
# Un segundo `npm ci` en build choca con el cache mount → EBUSY en
# node_modules/.cache (errno -16).

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/login"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
